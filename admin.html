<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración - Estancias Agradables</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <header class="encabezado">

        <div class="logo">
            <span>Estancias</span> Agradables
        </div>

        <nav>
            <a href="index.html">Ver página</a>
        </nav>

    </header>


    <main class="seccion">

        <h1>Panel de administración</h1>

        <p class="subtitulo">
            Administración de alojamientos
        </p>


        <!-- LOGIN -->

        <section id="login">

            <h2>Iniciar sesión</h2>

            <input
                type="email"
                id="correo"
                placeholder="Correo electrónico"
            >

            <input
                type="password"
                id="contrasena"
                placeholder="Contraseña"
            >

            <button
                class="boton-principal"
                onclick="iniciarSesion()"
            >
                Iniciar sesión
            </button>

            <p id="mensajeLogin"></p>

        </section>


        <!-- PANEL ADMINISTRATIVO -->

        <section id="panel" style="display: none;">

            <h2>Mis alojamientos</h2>

            <button
                class="boton-principal"
                onclick="mostrarFormulario()"
            >
                + Nuevo alojamiento
            </button>


            <div id="listaAdmin">

                <p>Cargando...</p>

            </div>


            <!-- FORMULARIO -->

            <div
                id="formularioAlojamiento"
                style="display: none;"
            >

                <h2>Nuevo alojamiento</h2>


                <label>Nombre</label>

                <input
                    type="text"
                    id="nombreAlojamiento"
                    placeholder="Ej. Apartamento Mar Azul"
                >


                <label>Descripción</label>

                <textarea
                    id="descripcionAlojamiento"
                    placeholder="Describe el alojamiento..."
                ></textarea>


                <label>Precio por noche</label>

                <input
                    type="number"
                    id="precioBase"
                    min="0"
                    step="0.01"
                >


                <label>Personas incluidas</label>

                <input
                    type="number"
                    id="personasIncluidas"
                    min="1"
                    value="2"
                >


                <label>Precio por persona adicional</label>

                <input
                    type="number"
                    id="precioPersona"
                    min="0"
                    step="0.01"
                >


                <label>Máximo de huéspedes</label>

                <input
                    type="number"
                    id="maxHuespedes"
                    min="1"
                >


                <label>Habitaciones</label>

                <input
                    type="number"
                    id="habitaciones"
                    min="1"
                    value="1"
                >


                <label>Baños</label>

                <input
                    type="number"
                    id="banos"
                    min="1"
                    value="1"
                >


                <label>Ubicación</label>

                <input
                    type="text"
                    id="ubicacion"
                    placeholder="Ej. Puerto Barrios, Izabal"
                >


                <label>

                    <input
                        type="checkbox"
                        id="publicado"
                    >

                    Publicar alojamiento

                </label>


                <br>
                <br>


                <button
                    class="boton-principal"
                    onclick="guardarAlojamiento()"
                >
                    Guardar alojamiento
                </button>


                <button
                    onclick="cancelarFormulario()"
                >
                    Cancelar
                </button>


                <p id="mensajeFormulario"></p>

            </div>

        </section>

    </main>


    <footer id="contacto">

        <h3>Estancias Agradables</h3>

        <p>
            Un lugar para disfrutar de una estancia agradable.
        </p>

        <p>
            © 2026 Estancias Agradables
        </p>

    </footer>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- JAVASCRIPT DEL ADMINISTRADOR -->

    <script src="admin.js"></script>

</body>

</html>
